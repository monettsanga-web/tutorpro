# Hong Kong mirror for mainland-Chinese parents (docs/CHINA-ACCESS.md, Fix A).
# Set server_name to the subdomain you point at this server, then:
#   nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name cn-go.tutorpro.site;   # <- change me

    root /var/www/tutorpro-mirror;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Built assets are hash-named: cache forever. Pages: always revalidate.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
