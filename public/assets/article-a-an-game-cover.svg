<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Article A / An Board Game cover</title>
  <desc id="desc">A colorful English grammar board game cover featuring giant A and AN letters, a winding board path, stars, books, and playful classroom objects.</desc>
  <defs>
